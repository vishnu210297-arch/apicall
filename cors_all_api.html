<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Call Example</title>
    <script>
        async function fetchData() {
            const apiUrl = 'https://boomisit.merckgroup.com/ws/rest/boomi/ping'; // API endpoint

            try {
                const response = await fetch(apiUrl, {
                    method: 'GET', // Use GET method
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded' // Use a simple content type
                        // No custom headers to avoid preflight
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('result').innerText = 'Success: ' + JSON.stringify(data, null, 2);
                } else if (response.status === 401) {
                    promptForCredentials();
                } else {
                    const errorText = await response.text(); // Get the error text from the response
                    throw new Error(`Network response was not ok: ${response.status} - ${response.statusText}. Error details: ${errorText}`);
                }
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
                document.getElementById('result').innerText = 'Error: ' + error.message;
            }
        }

        function promptForCredentials() {
            const username = prompt("Enter your username:");
            const password = prompt("Enter your password:");

            if (username && password) {
                fetchDataWithAuth(username, password); // Retry the API call with Basic Auth
            } else {
                document.getElementById('result').innerText = 'Authentication required, but no credentials provided.';
            }
        }

        async function fetchDataWithAuth(username, password) {
            const apiUrl = 'https://boomisit.merckgroup.com/ws/rest/boomi/ping'; // API endpoint

            try {
                const base64Credentials = btoa(`${username}:${password}`);
                const response = await fetch(apiUrl, {
                    method: 'GET', // Use GET method
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded', // Use a simple content type
                        'Authorization': `Basic ${base64Credentials}` // This will trigger a preflight
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('result').innerText = 'Success: ' + JSON.stringify(data, null, 2);
                } else {
                    const errorText = await response.text(); // Get the error text from the response
                    throw new Error(`Network response was not ok: ${response.status} - ${response.statusText}. Error details: ${errorText}`);
                }
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
                document.getElementById('result').innerText = 'Error: ' + error.message;
            }
        }
    </script>
</head>
<body>
    <h1>API Call Example</h1>
    <button onclick="fetchData()">Call API</button>
    <pre id="result"></pre>
</body>
</html>
